name: Build pandas for Android

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Install build tools
        run: |
          sudo apt update
          sudo apt install -y \
            python3 \
            python3-pip \
            python3-venv \
            build-essential \
            cmake \
            ninja-build \
            pkg-config \
            libopenblas-dev \
            liblapack-dev

      - name: Create environment
        run: |
          python3 -m venv build-env
          source build-env/bin/activate
          pip install -U pip setuptools wheel
          pip install numpy

      - name: Build pandas from PyPI
        run: |
          source build-env/bin/activate
          pip install --no-binary=pandas pandas

      - name: Collect package
        run: |
          mkdir -p artifact
          cp -r build-env/lib/python*/site-packages/pandas artifact/
          cp -r build-env/lib/python*/site-packages/pandas-*.dist-info artifact/ || true

      - name: Zip
        run: |
          cd artifact
          zip -r ../pandas-android.zip .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pandas-android
          path: pandas-android.zip
