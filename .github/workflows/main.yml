name: Build pandas for Termux Android

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/termux/package-builder:latest

    env:
      TERMUX_ARCH: aarch64
      TERMUX_PKG_API_LEVEL: "24"
      TERMUX_PREFIX: /data/data/com.termux/files/usr

    steps:
      # ------------------------------------------------------------
      # 1. Build Base Dependencies Using Termux Native Pipeline
      # ------------------------------------------------------------
      - name: Build Termux Python, NumPy, and OpenBLAS
        run: |
          cd /home/builder/termux-packages
          # Build target dependencies
          ./build-package.sh -a ${{ env.TERMUX_ARCH }} python
          ./build-package.sh -a ${{ env.TERMUX_ARCH }} python-numpy
          ./build-package.sh -a ${{ env.TERMUX_ARCH }} openblas

      # ------------------------------------------------------------
      # 2. Extract & Inspect Target Sysroot
      # ------------------------------------------------------------
      - name: Extract Target Staging Sysroot
        id: sysroot
        run: |
          cd /home/builder/termux-packages
          mkdir -p target-sysroot
          for deb in output/*.deb; do
            echo "Extracting $deb..."
            dpkg-deb -x "$deb" target-sysroot/
          done

          TARGET_DIR="/home/builder/termux-packages/target-sysroot${{ env.TERMUX_PREFIX }}"
          
          # Discover precise paths dynamically
          PYTHON_INC=$(find "$TARGET_DIR/include" -maxdepth 2 -type f -name "Python.h" | head -n1)
          PYTHON_VER_DIR=$(basename "$(dirname "$PYTHON_INC")")
          PYTHON_VER_SHORT=${PYTHON_VER_DIR#python} # e.g., 3.11, 3.12
          
          NUMPY_INC=$(find "$TARGET_DIR/lib/$PYTHON_VER_DIR/site-packages" -type d \( -name "include" -o -name "_core" \) | grep -E "numpy/(_core/)?include$" | head -n1)
          SYSCONFIG=$(find "$TARGET_DIR/lib/$PYTHON_VER_DIR" -type f -name "_sysconfigdata*.py" | head -n1)
          LIBPYTHON=$(find "$TARGET_DIR/lib" -type f -name "libpython${PYTHON_VER_SHORT}*.so" | head -n1)
          
          # Discover Android Clang dynamically from container's Android SDK/NDK
          CLANG_BIN=$(find / -name "aarch64-linux-android${{ env.TERMUX_PKG_API_LEVEL }}-clang" 2>/dev/null | head -n1)
          TOOLCHAIN_BIN=$(dirname "$CLANG_BIN")

          echo "=== Discovery Summary ==="
          echo "Target Include Dir: $TARGET_DIR/include/$PYTHON_VER_DIR"
          echo "NumPy Headers:      $NUMPY_INC"
          echo "Sysconfig File:     $SYSCONFIG"
          echo "LibPython:          $LIBPYTHON"
          echo "Toolchain Bin:      $TOOLCHAIN_BIN"

          # Fail fast if critical components are absent
          if [ -z "$CLANG_BIN" ] || [ -z "$NUMPY_INC" ] || [ -z "$SYSCONFIG" ]; then
            echo "::error::Critical toolchain or target header path discovery failed."
            exit 1
          fi

          echo "target_prefix=$TARGET_DIR" >> "$GITHUB_OUTPUT"
          echo "python_ver=$PYTHON_VER_DIR" >> "$GITHUB_OUTPUT"
          echo "python_ver_short=$PYTHON_VER_SHORT" >> "$GITHUB_OUTPUT"
          echo "numpy_include=$NUMPY_INC" >> "$GITHUB_OUTPUT"
          echo "sysconfig_dir=$(dirname "$SYSCONFIG")" >> "$GITHUB_OUTPUT"
          echo "sysconfig_name=$(basename "$SYSCONFIG" .py)" >> "$GITHUB_OUTPUT"
          echo "toolchain_bin=$TOOLCHAIN_BIN" >> "$GITHUB_OUTPUT"

      # ------------------------------------------------------------
      # 3. Create Meson Cross File & Python Build Shim
      # ------------------------------------------------------------
      - name: Prepare Cross Environment and NumPy Shim
        run: |
          TOOLCHAIN="${{ steps.sysroot.outputs.toolchain_bin }}"
          
          # Generate Meson cross configuration
          cat > /tmp/cross-android.txt <<EOF
          [binaries]
          c = '$TOOLCHAIN/aarch64-linux-android${{ env.TERMUX_PKG_API_LEVEL }}-clang'
          cpp = '$TOOLCHAIN/aarch64-linux-android${{ env.TERMUX_PKG_API_LEVEL }}-clang++'
          ar = '$TOOLCHAIN/llvm-ar'
          strip = '$TOOLCHAIN/llvm-strip'
          ranlib = '$TOOLCHAIN/llvm-ranlib'
          pkgconfig = 'pkg-config'

          [host_machine]
          system = 'android'
          cpu_family = 'aarch64'
          cpu = 'armv8-a'
          endian = 'little'

          [properties]
          needs_exe_wrapper = true
          EOF

          # Construct an isolated Python virtual environment on the host
          python3 -m venv /tmp/host-build-env
          source /tmp/host-build-env/bin/activate
          pip install --upgrade pip build wheel cython meson meson-python ninja setuptools-scm packaging

          # Intercept host Python NumPy resolution:
          # Create a shim numpy module in host venv pointing to the target headers
          HOST_SITE_PACKAGES=$(python3 -c "import site; print(site.getsitepackages()[0])")
          mkdir -p "$HOST_SITE_PACKAGES/numpy"

          cat > "$HOST_SITE_PACKAGES/numpy/__init__.py" <<EOF
          __version__ = "2.0.0"
          def get_include():
              return "${{ steps.sysroot.outputs.numpy_include }}"
          EOF

          cat > "$HOST_SITE_PACKAGES/numpy/_core.py" <<EOF
          def get_include():
              return "${{ steps.sysroot.outputs.numpy_include }}"
          EOF

          echo "Testing numpy import shim under host Python:"
          python3 -c "import numpy; print('NumPy header path redirected to:', numpy.get_include())"

      # ------------------------------------------------------------
      # 4. Fetch Pandas Source and Cross-Compile
      # ------------------------------------------------------------
      - name: Build Pandas Wheel
        env:
          TARGET_PREFIX: ${{ steps.sysroot.outputs.target_prefix }}
          PYTHON_VER: ${{ steps.sysroot.outputs.python_ver }}
          PYTHON_VER_SHORT: ${{ steps.sysroot.outputs.python_ver_short }}
          _PYTHON_SYSCONFIGDATA_NAME: ${{ steps.sysroot.outputs.sysconfig_name }}
          PYTHONPATH: ${{ steps.sysroot.outputs.sysconfig_dir }}
        run: |
          source /tmp/host-build-env/bin/activate

          export CFLAGS="-I$TARGET_PREFIX/include -I$TARGET_PREFIX/include/$PYTHON_VER -I${{ steps.sysroot.outputs.numpy_include }} -fPIC"
          export CXXFLAGS="$CFLAGS"
          export LDFLAGS="-L$TARGET_PREFIX/lib -lpython$PYTHON_VER_SHORT -lopenblas"
          export PKG_CONFIG_PATH="$TARGET_PREFIX/lib/pkgconfig"

          mkdir -p /tmp/pandas-build /tmp/wheelhouse
          cd /tmp/pandas-build
          pip download --no-binary pandas --no-deps pandas
          tar -xf pandas-*.tar.gz --strip-components=1

          # Compile wheel via meson-python backend
          python3 -m pip wheel \
            --no-deps \
            --no-build-isolation \
            -Csetup-args=--cross-file=/tmp/cross-android.txt \
            . \
            -w /tmp/wheelhouse

      # ------------------------------------------------------------
      # 5. Validate Native Architecture and Linkage
      # ------------------------------------------------------------
      - name: Verify Architecture and Linkage
        run: |
          mkdir -p /tmp/inspect
          cd /tmp/wheelhouse
          WHL=$(ls pandas-*.whl | head -n1)
          echo "Wheel built: $WHL"

          unzip -q "$WHL" -d /tmp/inspect

          echo "=== Checking ELF Header Architecture ==="
          find /tmp/inspect -name "*.so" -exec file {} +

          echo "=== Checking Shared Object Linking Dependencies ==="
          find /tmp/inspect -name "*.so" -exec ldd {} + 2>/dev/null || true

      # ------------------------------------------------------------
      # 6. Upload Final Artifact
      # ------------------------------------------------------------
      - name: Package and Upload
        uses: actions/upload-artifact@v4
        with:
          name: pandas-termux-aarch64
          path: /tmp/wheelhouse/*.whl
          if-no-files-found: error
