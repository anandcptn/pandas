name: Build pandas for Termux Android (container)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/termux/package-builder:latest

    env:
      TERMUX_ARCH: aarch64
      TERMUX_PKG_API_LEVEL: "24"
      TERMUX_PREFIX: /data/data/com.termux/files/usr

    steps:
      # ------------------------------------------------------------
      # 1. Checkout our repository
      # ------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ------------------------------------------------------------
      # 2. Clone termux-packages into the container.
      #
      # IMPORTANT: /home/builder/termux-packages inside this image
      # is NOT pre-populated with the repo. Termux's own
      # run-docker.sh script bind-mounts a host-side checkout into
      # that path at container start - the image itself only has
      # the Ubuntu/NDK/toolchain environment baked in. Since GitHub
      # Actions' `container:` directive starts the container
      # directly (it doesn't run run-docker.sh), that mount never
      # happens - so we clone the repo ourselves into that exact
      # path. This is what "./build-package.sh: not found" meant:
      # not a broken script, an empty directory.
      # ------------------------------------------------------------
      - name: Clone termux-packages into expected path
        run: |
          rm -rf /home/builder/termux-packages
          git clone --depth=1 https://github.com/termux/termux-packages.git /home/builder/termux-packages
          ls -la /home/builder/termux-packages/build-package.sh

      # ------------------------------------------------------------
      # 3. Build Python + NumPy + OpenBLAS using Termux's own
      # in-container build scripts. The container already has the
      # Ubuntu host setup baked in at image-build time, so we don't
      # run setup-ubuntu.sh here - that's what killed the bare-
      # runner version with "Unable to locate package python3.14-venv".
      # ------------------------------------------------------------
      - name: Build Termux Python, NumPy, OpenBLAS
        run: |
          cd /home/builder/termux-packages
          ./build-package.sh -a ${{ env.TERMUX_ARCH }} python
          ./build-package.sh -a ${{ env.TERMUX_ARCH }} python-numpy
          ./build-package.sh -a ${{ env.TERMUX_ARCH }} openblas

      # ------------------------------------------------------------
      # 3. Extract staged .deb packages into a sysroot
      # ------------------------------------------------------------
      - name: Extract staged packages
        run: |
          cd /home/builder/termux-packages
          mkdir -p target-sysroot
          for deb in output/*.deb; do
            echo "Extracting $deb"
            dpkg-deb -x "$deb" target-sysroot/
          done

          echo "========== staged tree (top levels) =========="
          find target-sysroot -maxdepth 8 -type d | head -80

      # ------------------------------------------------------------
      # 4. Discover target Python/NumPy paths - hard fail if
      # anything expected is missing, same defensive approach as
      # our bare-runner version.
      # ------------------------------------------------------------
      - name: Discover target include/lib paths
        id: paths
        run: |
          TARGET_DIR="/home/builder/termux-packages/target-sysroot${{ env.TERMUX_PREFIX }}"
          echo "target_dir=$TARGET_DIR" >> "$GITHUB_OUTPUT"

          PYTHON_H=$(find "$TARGET_DIR/include" -maxdepth 2 -name Python.h | head -1)
          NUMPY_H_NEW=$(find "$TARGET_DIR" -path '*numpy/_core/include/numpy/arrayobject.h' | head -1)
          NUMPY_H_OLD=$(find "$TARGET_DIR" -path '*numpy/core/include/numpy/arrayobject.h' | head -1)
          SYSCONFIG=$(find "$TARGET_DIR" -name '_sysconfigdata*.py' | head -1)
          LIBPYTHON=$(find "$TARGET_DIR/lib" -maxdepth 1 -iname 'libpython3*.so*' | head -1)

          echo "Python.h        = $PYTHON_H"
          echo "numpy (_core)   = $NUMPY_H_NEW"
          echo "numpy (core)    = $NUMPY_H_OLD"
          echo "sysconfigdata   = $SYSCONFIG"
          echo "libpython       = $LIBPYTHON"

          if [ -z "$PYTHON_H" ]; then
            echo "::error::Could not find target Python.h under $TARGET_DIR/include"
            exit 1
          fi
          if [ -z "$NUMPY_H_NEW" ] && [ -z "$NUMPY_H_OLD" ]; then
            echo "::error::Could not find target NumPy headers (checked both numpy/_core and numpy/core layouts)"
            exit 1
          fi
          if [ -z "$SYSCONFIG" ]; then
            echo "::error::Could not find target _sysconfigdata*.py - cannot safely proceed without confirming interpreter ABI naming"
            exit 1
          fi
          if [ -z "$LIBPYTHON" ]; then
            echo "::error::Could not find staged libpython*.so - linking would fail or silently fall back to host"
            exit 1
          fi

          PYTHON_VER_DIR=$(basename "$(dirname "$PYTHON_H")")
          NUMPY_INCLUDE_DIR=$(dirname "$(dirname "${NUMPY_H_NEW:-$NUMPY_H_OLD}")")

          echo "python_include=$(dirname "$PYTHON_H")" >> "$GITHUB_OUTPUT"
          echo "python_ver_dir=$PYTHON_VER_DIR" >> "$GITHUB_OUTPUT"
          echo "numpy_include=$NUMPY_INCLUDE_DIR" >> "$GITHUB_OUTPUT"
          echo "sysconfig_dir=$(dirname "$SYSCONFIG")" >> "$GITHUB_OUTPUT"
          echo "sysconfig_name=$(basename "$SYSCONFIG" .py)" >> "$GITHUB_OUTPUT"
          echo "libpython_path=$LIBPYTHON" >> "$GITHUB_OUTPUT"

      # ------------------------------------------------------------
      # 5. Download pandas source
      # ------------------------------------------------------------
      - name: Download pandas source
        run: |
          mkdir -p /tmp/pandas-build
          cd /tmp/pandas-build
          pip3 download --no-binary pandas --no-deps pandas
          tar -xf pandas-*.tar.gz --strip-components=1

      # ------------------------------------------------------------
      # 6. GATE: same hard gate as the bare-runner version. Moving
      # to the container fixes toolchain/sysroot paths - it does
      # NOT change how Python import resolution works.
      # ------------------------------------------------------------
      - name: Gate on live numpy import in build config
        working-directory: /tmp/pandas-build
        run: |
          MESON_HITS=$(grep -rn "numpy" --include="meson.build" . || true)
          IMPORT_HITS=$(grep -rln "import numpy\|numpy\.get_include" . --include="*.py" || true)

          echo "========== meson.build numpy references =========="
          echo "$MESON_HITS"
          echo
          echo "========== python files calling numpy at build time =========="
          echo "$IMPORT_HITS"

          if echo "$MESON_HITS $IMPORT_HITS" | grep -qi "numpy"; then
            echo
            echo "::error::pandas' build references numpy at build time (get_include() or a live import)."
            echo "::error::This runs under the CONTAINER's pip3/python3, whose 'numpy' resolves via normal"
            echo "::error::sys.path - not via CFLAGS/CPATH. Unless the container's own pip3 environment"
            echo "::error::has a numpy installed whose get_include() points at the STAGED Android numpy"
            echo "::error::headers (not a host-installed one), this will build against the wrong ABI."
            echo "::error::Next: either pip3 install a shim numpy package in the container's build env"
            echo "::error::whose get_include() is patched to point at \${{ steps.paths.outputs.numpy_include }},"
            echo "::error::or use a crossenv-style interpreter for the build step."
            exit 1
          else
            echo "No build-time numpy import detected - safe to proceed on this front."
          fi

      # ------------------------------------------------------------
      # 7. Create Meson cross fil
      # ------------------------------------------------------------
      - name: Create Meson cross file
        run: |
          NDK=$(find / -maxdepth 6 -iname 'android-ndk*' -type d 2>/dev/null | head -1)
          echo "Detected NDK at: $NDK"
          if [ -z "$NDK" ]; then
            echo "::error::Could not auto-detect NDK directory - check container layout with 'find / -iname toolchains'"
            exit 1
          fi

          TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64"
          CC="$TOOLCHAIN/bin/aarch64-linux-android${{ env.TERMUX_PKG_API_LEVEL }}-clang"
          if [ ! -f "$CC" ]; then
            echo "::error::Expected compiler not found at $CC - listing available clang binaries:"
            find "$TOOLCHAIN/bin" -iname '*clang*' 2>/dev/null
            exit 1
          fi

          cat > /tmp/cross-android.txt <<EOF
          [binaries]
          c = '$CC'
          cpp = '${CC}++'
          ar = '$TOOLCHAIN/bin/llvm-ar'
          strip = '$TOOLCHAIN/bin/llvm-strip'
          ranlib = '$TOOLCHAIN/bin/llvm-ranlib'
          pkgconfig = 'pkg-config'

          [host_machine]
          system = 'android'
          cpu_family = 'aarch64'
          cpu = 'armv8-a'
          endian = 'little'

          [properties]
          needs_exe_wrapper = true
          EOF

          cat /tmp/cross-android.txt
          echo "ndk_toolchain=$TOOLCHAIN" >> "$GITHUB_ENV"

      # ------------------------------------------------------------
      # 8. Build pandas wheel
      # ------------------------------------------------------------
      - name: Build pandas wheel
        working-directory: /tmp/pandas-build
        env:
          CFLAGS: >-
            -I${{ steps.paths.outputs.python_include }}
            -I${{ steps.paths.outputs.numpy_include }}
            -fPIC
          CXXFLAGS: >-
            -I${{ steps.paths.outputs.python_include }}
            -I${{ steps.paths.outputs.numpy_include }}
            -fPIC
          LDFLAGS: >-
            -L${{ steps.paths.outputs.target_dir }}/lib
          PYTHONPATH: ${{ steps.paths.outputs.sysconfig_dir }}
          _PYTHON_SYSCONFIGDATA_NAME: ${{ steps.paths.outputs.sysconfig_name }}
        run: |
          pip3 install --upgrade pip build wheel setuptools-scm cython meson-python ninja

          mkdir -p /home/builder/wheelhouse

          python3 -m pip wheel \
            --no-deps \
            --no-build-isolation \
            -Csetup-args=--cross-file=/tmp/cross-android.txt \
            . \
            -w /home/builder/wheelhouse

      # ------------------------------------------------------------
      # 9. Verify actual ABI - no auto-retagging. Confirm the .so
      # files are genuinely ARM/Android before any tag decision.
      # ------------------------------------------------------------
      - name: Verify wheel ABI before any tagging decision
        run: |
          cd /home/builder/wheelhouse
          WHL=$(ls pandas-*.whl | head -1)
          echo "Wheel produced: $WHL"

          rm -rf /tmp/inspect
          mkdir -p /tmp/inspect
          unzip -q "$WHL" -d /tmp/inspect

          SO_FILES=$(find /tmp/inspect -name '*.so' | head -5)
          if [ -z "$SO_FILES" ]; then
            echo "::error::No .so files in wheel - pandas requires native extensions, this wheel is wrong"
            exit 1
          fi

          for so in $SO_FILES; do
            echo
            echo "---- $so ----"
            file "$so"
          done

          echo
          echo "Expect: ELF 64-bit LSB shared object, ARM aarch64."
          echo "If 'file' reports x86-64 instead, the cross file was not honored - stop here,"
          echo "do not tag or ship this wheel. Tagging is a manual step you run after confirming this."

      # ------------------------------------------------------------
      # 10. Package artifacts (untagged wheel + inspection output)
      # ------------------------------------------------------------
      - name: Package artifacts
        run: |
          mkdir -p /tmp/artifact
          cp /home/builder/wheelhouse/*.whl /tmp/artifact/
          cd /tmp/artifact
          zip -r /home/builder/pandas-termux-aarch64.zip .

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: pandas-termux-aarch64
          path: /home/builder/pandas-termux-aarch64.zip
          if-no-files-found: error
